!StandardConfig
experiment: !ExperimentConfig
  name: "UTT_FUSION IEMOCAP 8"
  device: "cuda"
  train_print_interval_epochs: 1
  validation_print_interval_epochs: 1
  is_train: true
  is_test: true

model: !ModelConfig
  name: "UTT-Fusion"
  model_type: "UttFusionModel"
  
  netA: !LSTMEncoder
    input_size: 130
    hidden_size: 128
    embd_method: "maxpool"

  netV: !LSTMEncoder
    input_size: 342
    hidden_size: 128
    embd_method: "maxpool"

  netT: !TextCNN
    input_size: 1024
    dropout: 0.3
    in_channels: 1
    out_channels: 128
    kernel_heights: 
      - 3
      - 4
      - 5
  netC: !FcClassifier
    input_dim: 384
    layers: 
      - 128
      - 128
    output_dim: 4
    dropout: 0.3
    use_bn: true

  clip: 0.5

training:
  epochs: 20
  batch_size: 128
  early_stopping: false
  early_stopping_patience: 15
  early_stopping_metric: "loss"
  num_modalities: 3
  optimizer: !Optimizer
    name: "Adam"
    default_kwargs:
      lr: 2e-4
      weight_decay: 0.00001
      beta1: 0.9
  scheduler: "lambda"
  scheduler_args:
    epoch_count: 1
    niter: 10
    niter_decay: 10
    lr_lambda: "1.0 - max(0, epoch + epoch_count - niter) / float(niter_decay + 1)"
  loss_functions: !LossFunctionGroup
    cross_entropy: 
      loss_name: "cross_entropy"
      loss_args: {}
      weight: 1.0

data: !DataConfig
  use_collate_fn: true
  datasets:
    train: !DatasetConfig
      cv_no: 8
      batch_size: 128
      dataset: "iemocap"
      data_fp: "$DATA/iemocap"
      split: "train"
      drop_last: true
      target_modality: !Modality "MULTIMODAL"
      shuffle: true
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0  # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0  # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig 
            missing_rate: 0.0  # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt"]  # Only use these combinations of modalities
      kwargs:
        labels_key: "classification_labels"
        A_type: "comparE"
        name: iemocap
    validation: !DatasetConfig
      cv_no: 8
      batch_size: 128
      dataset: "iemocap"
      data_fp: "$DATA/iemocap"
      split: "valid"
      shuffle: true
      drop_last: true
      target_modality: !Modality "MULTIMODAL"
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0  # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0  # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig 
            missing_rate: 0.0  # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt", "a", "v", "t", "av", "at", "vt"]
      kwargs:
        labels_key: "classification_labels"
        A_type: "comparE"
        name: iemocap
    test: !DatasetConfig
      cv_no: 8
      batch_size: 128
      dataset: "iemocap"
      data_fp: "$DATA/iemocap"
      split: "test"
      drop_last: true
      target_modality: !Modality "MULTIMODAL"
      shuffle: true
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0  # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0  # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig 
            missing_rate: 0.0  # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt", "a", "v", "t", "av", "at", "vt"]
      kwargs:
        labels_key: "classification_labels"
        A_type: "comparE"
        name: iemocap

metrics:
  metrics:
    Balanced_Accuracy:
      function: "sklearn.metrics.balanced_accuracy_score"
      kwargs: {}
      level: "epoch"
    Accuracy:
      function: "sklearn.metrics.accuracy_score"
      kwargs: {}
      level: "epoch"
    F1_Weighted:
      function: "sklearn.metrics.f1_score"
      kwargs: 
        average: "weighted"
        zero_division: 0
      level: "epoch"    
    F1_Micro:
      function: "sklearn.metrics.f1_score"
      kwargs: 
        average: "micro"
        zero_division: 0
      level: "epoch"
    F1_Macro:
      function: "sklearn.metrics.f1_score"
      kwargs:
        average: "macro"
        zero_division: 0
      level: "epoch"
    Precision_Weighted:
      function: "sklearn.metrics.precision_score"
      kwargs: 
        average: "weighted"
        zero_division: 0
      level: "epoch"
    Precision_Micro:
      function: "sklearn.metrics.precision_score"
      kwargs:
        average: "micro"
        zero_division: 0
      level: "epoch"
    Precision_Macro:
      function: "sklearn.metrics.precision_score"
      kwargs:
        average: "macro"
        zero_division: 0
      level: "epoch"
    Recall_Weighted:
      function: "sklearn.metrics.recall_score"
      kwargs: 
        average: "weighted"
        zero_division: 0
      level: "epoch"
    Recall_Micro:
      function: "sklearn.metrics.recall_score"
      kwargs: 
        average: "micro"
        zero_division: 0
      level: "epoch"
    Recall_Macro:
      function: "sklearn.metrics.recall_score"
      kwargs: 
        average: "macro"
        zero_division: 0
      level: "epoch"
    ConfusionMatrix:
      function: "metrics.confusion_matrix_from_logits"
      kwargs: {
        "labels": [0, 1, 2, 3]
      }
      level: "epoch"
    mae:
      function: "sklearn.metrics.mean_absolute_error"
      kwargs: {}
    mse:
      function: "sklearn.metrics.mean_squared_error"
      kwargs: {}
    cosine:
      function: "metrics.cosine_similarity"
      kwargs: {}
  groups:
      classification: ["Balanced_Accuracy", "F1_Weighted", "F1_Micro", "F1_Macro", "Precision_Weighted", "Precision_Micro", "Precision_Macro", "Recall_Weighted", "Recall_Micro", "Recall_Macro", "ConfusionMatrix"]
      reconstruction: ["mae", "mse", "cosine"]

logging:
  log_path: "$EXP_PATH/wch1/{experiment_name}/logs/{run_id}"
  model_output_path: "$EXP_PATH/wch1/{experiment_name}/models/{run_id}"
  metrics_path: "$EXP_PATH/wch1/{experiment_name}/metrics/{run_id}"
  save_metric: "Recall_Macro_ATV"
  monitor_path: "$EXP_PATH/wch1/{experiment_name}/monitoring/{run_id}"
  tensorboard_path: "$EXP_PATH/wch1/{experiment_name}/tensorboard/{run_id}"
  tb_record_only:
    - "loss"

monitoring:
  enabled: false
  gradient_interval: 100
  activation_interval: 100
  weight_interval: 200
  buffer_size: 1000
  compression: "gzip"
  compression_opts: 4
  enable_gradient_tracking: true
  enable_activation_tracking: true
  enable_weight_tracking: true
  enable_layer_convergence: true
  enable_information_flow: false