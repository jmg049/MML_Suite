!StandardConfig
experiment: !ExperimentConfig
  name: "RedCore MOSEI"
  device: "cuda"
  train_print_interval_epochs: 1
  validation_print_interval_epochs: 1
  is_train: true
  is_test: true

model: !ModelConfig
  name: "RedCore"
  model_type: "RedCore"

  netA: !Transformer
    width: 74            
    layers: 3              # fixed in original code
    heads: 8               # fixed in original code
    embd_width: 96            # `--embd_size_a=128`

  netV: !Transformer
    width: 35            # `--input_dim_v=342` (based on `denseface`)
    layers: 3
    heads: 8
    embd_width: 96            # `--embd_size_v=128`

  netT: !Transformer
    width: 768          
    layers: 3
    heads: 8
    embd_width: 96            # `--embd_size_l=128`

  netC: !FcClassifier
    input_dim: 288         # [128_A + 128_V + 128_T]
    layers: [96, 96]         # `--cls_layers=128,128`
    output_dim: 4              # `--output_dim=4`
    dropout: 0.5               # `--dropout_rate=0.5`
    use_bn: false              # no `--bn` flag passed

  netAE: !ResidualAE
    layers: [160, 80, 32]     # `--AE_layers=256,128,64`
    n_blocks: 5                # `--n_blocks=5`
    input_dim: 288             # 128 * 3 input to AE
    dropout: 0.0
    use_bn: false

  netAT_V: !ResidualXE
    layers: [160, 80, 32]
    n_blocks: 5
    input_dim: 192       # A + T
    output_dim: 96            # for V
    dropout: 0.0
    use_bn: false

  netAV_T: !ResidualXE
    layers: [160, 80, 32]
    n_blocks: 5
    input_dim: 192       # A + V
    output_dim: 96            # for T
    dropout: 0.0
    use_bn: false

  netVT_A: !ResidualXE
    layers: [160, 80, 32]
    n_blocks: 5
    input_dim: 192       # V + T
    output_dim: 96            # for A
    dropout: 0.0
    use_bn: false

  netC_A: !FcClassifier
    input_dim: 96
    layers: [96, 96]
    output_dim: 4
    dropout: 0.5
    use_bn: false

  netC_V: !FcClassifier
    input_dim: 96
    layers: [96, 96]
    output_dim: 4
    dropout: 0.5
    use_bn: false

  netC_T: !FcClassifier
    input_dim: 96
    layers: [96, 96]
    output_dim: 4
    dropout: 0.5
    use_bn: false

  clip: 1.0                    # match original training config
  loss_beta: 0.95             # corresponds to `opt.beta`
  interval_i: 2               # `--ii` not shown, but 2 is typical from their ablations
  eta: 0.001                  # `--eta=0.001` (in code)
  eta_ext: 1.5                # `--etaext=1.5` (in code)
  share_weight: false         # explicitly not passed in shell script
  mse_weight: 4.0
  cycle_weight: 2.0
  ce_weight: 1.0

training:
  epochs: 40
  batch_size: 256
  early_stopping: false
  early_stopping_patience: 15
  early_stopping_metric: "loss"
  num_modalities: 3
  optimizer: !Optimizer
    name: "Adam"
    default_kwargs:
      lr: 2e-4
      weight_decay: 0.00001
      betas: [0.9, 0.999]
  loss_functions: !LossFunctionGroup
    cross_entropy: 
      loss_name: "cross_entropy"
      loss_args: {}
      weight: 1.0
    mse: 
      loss_name: "mse"
      loss_args: 
        reduction: "sum"
      weight: 4.0

data: !DataConfig
  use_collate_fn: true
  datasets:
    train: !DatasetConfig
      batch_size: 256
      dataset: "mosei"
      data_fp: "$DATA/mosei/aligned.pkl"
      split: "train"
      target_modality: !Modality "MULTIMODAL"
      shuffle: true
      drop_last: true
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0  # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0  # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig 
            missing_rate: 0.0  # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt", "a", "v", "t", "av", "at", "vt"]  # Only use these combinations of modalities
      kwargs:
        aligned: true
        labels_key: "classification_labels"
    validation: !DatasetConfig
      batch_size: 256
      dataset: "mosei"
      data_fp: "$DATA/mosei/aligned.pkl"
      split: "valid"
      shuffle: true
      drop_last: true
      target_modality: !Modality "MULTIMODAL"
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0  # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0  # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig 
            missing_rate: 0.0  # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt", "a", "v", "t", "av", "at", "vt"]
      kwargs:
        aligned: true
        labels_key: "classification_labels"

    test: !DatasetConfig
      batch_size: 256
      dataset: "mosei"
      data_fp: "$DATA/mosei/aligned.pkl"
      split: "test"
      target_modality: !Modality "MULTIMODAL"
      shuffle: false
      drop_last: true
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0  # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0  # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig 
            missing_rate: 0.0  # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt", "a", "v", "t", "av", "at", "vt"]
      kwargs:
        aligned: true
        labels_key: "classification_labels"
    embeddings: !DatasetConfig
      batch_size: 256
      dataset: "mosei"
      data_fp: "$DATA/mosei/aligned.pkl"
      split: "test"
      target_modality: !Modality "MULTIMODAL"
      shuffle: false
      drop_last: true
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0  # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0  # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig 
            missing_rate: 0.0  # Text is ALWAYS present when included in pattern
        selected_patterns: [ "a", "v", "t", "av", "at", "vt"]
      kwargs:
        aligned: true
        labels_key: "classification_labels"

metrics:
  metrics:
    Accuracy:
      function: "sklearn.metrics.accuracy_score"
      kwargs: {}
      level: "epoch"
    F1_Weighted:
      function: "sklearn.metrics.f1_score"
      kwargs: 
        average: "weighted"
        zero_division: 0
      level: "epoch"    
    F1_Micro:
      function: "sklearn.metrics.f1_score"
      kwargs: 
        average: "micro"
        zero_division: 0
      level: "epoch"
    F1_Macro:
      function: "sklearn.metrics.f1_score"
      kwargs:
        average: "macro"
        zero_division: 0
      level: "epoch"
    Precision_Weighted:
      function: "sklearn.metrics.precision_score"
      kwargs: 
        average: "weighted"
        zero_division: 0
      level: "epoch"
    Precision_Micro:
      function: "sklearn.metrics.precision_score"
      kwargs:
        average: "micro"
        zero_division: 0
      level: "epoch"
    Precision_Macro:
      function: "sklearn.metrics.precision_score"
      kwargs:
        average: "macro"
        zero_division: 0
      level: "epoch"
    Recall_Weighted:
      function: "sklearn.metrics.recall_score"
      kwargs: 
        average: "weighted"
        zero_division: 0
      level: "epoch"
    Recall_Micro:
      function: "sklearn.metrics.recall_score"
      kwargs: 
        average: "micro"
        zero_division: 0
      level: "epoch"
    Recall_Macro:
      function: "sklearn.metrics.recall_score"
      kwargs: 
        average: "macro"
        zero_division: 0
      level: "epoch"
    MSA:
      function: "metrics.msa_binary_classification"
      kwargs: {}
      level: "epoch"
    ConfusionMatrix:
      function: "metrics.confusion_matrix_from_logits"
      kwargs: {
        "labels": [0, 1, 2]
      }
      level: "epoch"
  groups:
    "classification": ["MSA", "Accuracy", "F1_Weighted", "F1_Micro", "F1_Macro", "Precision_Weighted", "Precision_Micro", "Precision_Macro", "Recall_Weighted", "Recall_Micro", "Recall_Macro", "ConfusionMatrix"]

logging:
  log_path: "$EXP_PATH/wch3/{experiment_name}/logs/{run_id}/"
  model_output_path: "$EXP_PATH/wch3/{experiment_name}/models/{run_id}"
  metrics_path: "$EXP_PATH/wch3/{experiment_name}/metrics/{run_id}"
  save_metric: "Recall_Macro_ATV"
  monitor_path: "$EXP_PATH/wch3/{experiment_name}/monitoring/{run_id}"

monitoring:
  enabled: false
  gradient_interval: 100
  activation_interval: 100
  weight_interval: 200
  buffer_size: 1000
  compression: "gzip"
  compression_opts: 4
  enable_gradient_tracking: true
  enable_activation_tracking: true
  enable_weight_tracking: true
  enable_layer_convergence: true
  enable_information_flow: false
