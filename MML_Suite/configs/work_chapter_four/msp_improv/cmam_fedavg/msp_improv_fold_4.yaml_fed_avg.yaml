!FederatedExperimentConfig
experiment: !ExperimentConfig
  name: "FedMSP-Incongruent CV 4 20 Clients 5 Percent Global Data 25 Rounds 3 Epochs FedAvg"
  device: "cuda"
  train_print_interval_epochs: 1
  validation_print_interval_epochs: 1
  is_train: true
  is_test: true

model: !ModelConfig
  name: "UTT-Fusion"
  model_type: "UttFusionModel"
  netA: !LSTMEncoder
    input_size: 130
    hidden_size: 128
    embd_method: "maxpool"
  netV: !LSTMEncoder
    input_size: 342
    hidden_size: 128
    embd_method: "maxpool"
  netT: !TextCNN
    input_size: 1024
    dropout: 0.3
    in_channels: 1
    out_channels: 128
    kernel_heights:
      - 3
      - 4
      - 5
  netC: !FcClassifier
    input_dim: 384
    layers:
      - 128
      - 128
    output_dim: 4
    dropout: 0.3
    use_bn: true
  clip: 0.5

cmams:
  a: !ModelConfig
    name: "Simple_CMAM"
    model_type: "Simple_CMAM"
    target_modality: !Modality text
    load_pretrained_encoder_state_for: []
    labels_key: "label"
    input_modalities:
      - !Modality Audio
    association_network: !AssociationNetwork
      input_size: 128
      hidden_size: 128
      output_size: 128
      dropout: 0.4
      batch_norm: True
  v: !ModelConfig
    name: "Simple_CMAM"
    model_type: "Simple_CMAM"
    target_modality: !Modality text
    load_pretrained_encoder_state_for: []
    labels_key: "label"
    input_modalities:
      - !Modality video
    association_network: !AssociationNetwork
      input_size: 128
      hidden_size: 128
      output_size: 128
      dropout: 0.4
      batch_norm: True
  t: !ModelConfig
    name: "Simple_CMAM"
    model_type: "Simple_CMAM"
    target_modality: !Modality video
    load_pretrained_encoder_state_for: []
    labels_key: "label"
    input_modalities:
      - !Modality text
    association_network: !AssociationNetwork
      input_size: 128
      hidden_size: 128
      output_size: 128
      dropout: 0.4
      batch_norm: True
  at: !ModelConfig
    name: "Simple_CMAM"
    model_type: "Simple_CMAM"
    target_modality: !Modality video
    load_pretrained_encoder_state_for: []
    labels_key: "label"
    input_modalities:
      - !Modality Audio
      - !Modality Text
    association_network: !AssociationNetwork
      input_size: 256
      hidden_size: 256
      output_size: 128
      dropout: 0.4
      batch_norm: True
  av: !ModelConfig
    name: "Simple_CMAM"
    model_type: "Simple_CMAM"
    target_modality: !Modality text
    load_pretrained_encoder_state_for: []
    labels_key: "label"
    input_modalities:
      - !Modality audio
      - !Modality video
    association_network: !AssociationNetwork
      input_size: 256
      hidden_size: 256
      output_size: 128
      dropout: 0.4
      batch_norm: True

  tv: !ModelConfig
    name: "Simple_CMAM"
    model_type: "Simple_CMAM"
    target_modality: !Modality audio
    load_pretrained_encoder_state_for: []
    labels_key: "label"
    input_modalities:
      - !Modality video
      - !Modality text
    association_network: !AssociationNetwork
      input_size: 256
      hidden_size: 256
      output_size: 128
      dropout: 0.4
      batch_norm: True

fed_config: !FedConfig
  num_clients: 20
  num_rounds: 25
  modality_distribution_method: "incongruent"
  client_selection: !ClientSelection
    strategy: "round_robin"
  aggregation: !Aggregation
    type: "fed_avg"
    aggregation_method: "mean"
    aggregation_weights: "uniform"
  global_training:
    epochs: 3
    batch_size: 32
    early_stopping: false
    early_stopping_patience: 15
    early_stopping_metric: "loss"
    num_modalities: 3
    optimizer: !Optimizer
      name: "Adam"
      default_kwargs:
        lr: 2e-4
        weight_decay: 0.00001
    loss_functions: !LossFunctionGroup
      cross_entropy:
        loss_name: "cross_entropy"
        weight: 1.0
  global_cmam_training:
    epochs: 3
    batch_size: 32
    early_stopping: false
    early_stopping_patience: 15
    early_stopping_metric: "loss"
    num_modalities: 3
    optimizer: !Optimizer
      name: "Adam"
      default_kwargs:
        lr: 2e-4
        weight_decay: 0.00001
    loss_functions: !LossFunctionGroup
      cmam:
        loss_name: "cmam"
        loss_kwargs:
          {
            cosine_weight: 0.0,
            mse_weight: 1.0,
            mae_weight: 0.0,
            cls_weight: 0.00,
          }
        weight: 1.0
  client_training:
    epochs: 3
    batch_size: 32
    early_stopping: false
    early_stopping_patience: 15
    early_stopping_metric: "loss"
    num_modalities: 3
    optimizer: !Optimizer
      name: "Adam"
      default_kwargs:
        lr: 2e-4
        weight_decay: 0.00001
    loss_functions: !LossFunctionGroup
      cross_entropy:
        loss_name: "cross_entropy"
        weight: 1.0
  client_cmam_training:
    epochs: 3
    batch_size: 32
    early_stopping: false
    early_stopping_patience: 15
    early_stopping_metric: "loss"
    num_modalities: 3
    optimizer: !Optimizer
      name: "Adam"
      default_kwargs:
        lr: 2e-4
        weight_decay: 0.00001
    loss_functions: !LossFunctionGroup
      cmam:
        loss_name: "cmam"
        loss_kwargs:
          {
            cosine_weight: 0.0,
            mse_weight: 1.0,
            mae_weight: 0.0,
            cls_weight: 0.00,
          }
        weight: 1.0

fed_data: !FedDataConfig
  distribution_strategy: "iid" # or "non_iid"
  task_type: "classification" # or "multilabel_classification"
  global_fraction: 0.1
  datasets:
    train: !DatasetConfig
      dataset: "msp_improv"
      data_fp: "$DATA/msp_improv"
      split: "train"
      target_modality: !Modality "MULTIMODAL"
      shuffle: true
      batch_size: 64
      client_batch_size: 64
      cv_no: 4
      drop_last: true
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0 # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0 # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig
            missing_rate: 0.0 # Text is ALWAYS present when included in pattern
        selected_patterns: ["atv"]
      kwargs:
        labels_key: "classification_labels"
    validation: !DatasetConfig
      dataset: "msp_improv"
      data_fp: "$DATA/msp_improv"
      batch_size: 64
      client_batch_size: 64
      split: "valid"
      shuffle: true
      drop_last: true

      cv_no: 4
      target_modality: !Modality "MULTIMODAL"
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0 # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0 # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig
            missing_rate: 0.0 # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt", "a", "v", "t", "av", "at", "vt"]
      kwargs:
        labels_key: "classification_labels"
    test: !DatasetConfig
      dataset: "msp_improv"
      data_fp: "$DATA/msp_improv"
      split: "test"
      target_modality: !Modality "MULTIMODAL"
      shuffle: false
      batch_size: 64
      drop_last: true
      cv_no: 4
      client_batch_size: 64
      missing_patterns: !MissingPatternConfig
        modalities:
          !Modality audio: !ModalityConfig
            missing_rate: 0.0 # Audio is ALWAYS present when included in pattern
          !Modality video: !ModalityConfig
            missing_rate: 0.0 # Video is ALWAYS present when included in pattern
          !Modality text: !ModalityConfig
            missing_rate: 0.0 # Text is ALWAYS present when included in pattern
        selected_patterns: ["avt", "a", "v", "t", "av", "at", "vt"]
      kwargs:
        labels_key: "classification_labels"

metrics:
  metrics:
    Accuracy:
      function: "sklearn.metrics.accuracy_score"
      kwargs: {}
      level: "epoch"
    F1_Weighted:
      function: "sklearn.metrics.f1_score"
      kwargs:
        average: "weighted"
        zero_division: 0
      level: "epoch"
    F1_Micro:
      function: "sklearn.metrics.f1_score"
      kwargs:
        average: "micro"
        zero_division: 0
      level: "epoch"
    F1_Macro:
      function: "sklearn.metrics.f1_score"
      kwargs:
        average: "macro"
        zero_division: 0
      level: "epoch"
    Precision_Weighted:
      function: "sklearn.metrics.precision_score"
      kwargs:
        average: "weighted"
        zero_division: 0
      level: "epoch"
    Precision_Micro:
      function: "sklearn.metrics.precision_score"
      kwargs:
        average: "micro"
        zero_division: 0
      level: "epoch"
    Precision_Macro:
      function: "sklearn.metrics.precision_score"
      kwargs:
        average: "macro"
        zero_division: 0
      level: "epoch"
    Recall_Weighted:
      function: "sklearn.metrics.recall_score"
      kwargs:
        average: "weighted"
        zero_division: 0
      level: "epoch"
    Recall_Micro:
      function: "sklearn.metrics.recall_score"
      kwargs:
        average: "micro"
        zero_division: 0
      level: "epoch"
    Recall_Macro:
      function: "sklearn.metrics.recall_score"
      kwargs:
        average: "macro"
        zero_division: 0
      level: "epoch"
    MSA:
      function: "metrics.msa_binary_classification"
      kwargs: {}
      level: "epoch"
    ConfusionMatrix:
      function: "metrics.confusion_matrix_from_logits"
      kwargs: { "labels": [0, 1, 2, 3] }
      level: "epoch"
    mae:
      function: "sklearn.metrics.mean_absolute_error"
      kwargs: {}
    mse:
      function: "sklearn.metrics.mean_squared_error"
      kwargs: {}
    cosine:
      function: "metrics.cosine_similarity"
      kwargs: {}
  groups:
    classification:
      [
        "F1_Weighted",
        "F1_Micro",
        "F1_Macro",
        "Precision_Weighted",
        "Precision_Micro",
        "Precision_Macro",
        "Recall_Weighted",
        "Recall_Micro",
        "Recall_Macro",
        "ConfusionMatrix",
      ]
    reconstruction: ["mae", "mse", "cosine"]

logging:
  log_path: "$EXP_PATH/wch4/{experiment_name}/logs/{run_id}"
  model_output_path: "$EXP_PATH/wch4/{experiment_name}/models/{run_id}"
  metrics_path: "$EXP_PATH/wch4/{experiment_name}/metrics/{run_id}"
  save_metric: "loss"
  monitor_path: "$EXP_PATH/wch4/{experiment_name}/monitoring/{run_id}"
